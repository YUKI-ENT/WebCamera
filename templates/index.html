<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Web Camera Upload</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <div class="heading">
          <div>
            <p class="eyebrow">RSBase Camera</p>
            <h1>画像アップロード</h1>
          </div>
          <span id="modeBadge" class="mode-badge">ID連動</span>
        </div>

        <form id="uploadForm" class="upload-form">
          <section class="patient-panel" aria-label="患者情報">
            <div class="patient-topline">
              <label class="switch-row">
                <input id="useRsbase" type="checkbox" checked>
                <span class="switch" aria-hidden="true"></span>
                <span>RSBase ID連動</span>
              </label>
            </div>

            <dl class="patient-info">
              <div>
                <dt>ID</dt>
                <dd id="linkedPatientId">未取得</dd>
              </div>
              <div>
                <dt>患者名</dt>
                <dd id="linkedPatientName">未取得</dd>
              </div>
            </dl>
          </section>

          <section class="manual-panel" id="manualIdField" hidden>
            <label class="field">
              <span>手動ID</span>
              <input id="manualId" type="text" inputmode="numeric" autocomplete="off" placeholder="例: 34503">
            </label>
            <p class="hint" id="manualHint">RSBase ID連動がOFFです。空欄のまま保存すると仮IDを使用します。</p>
          </section>

          <label class="field">
            <span>検査名</span>
            <select id="examName" required></select>
          </label>

          <section class="media-actions" aria-label="撮影またはファイル選択">
            <label class="media-action">
              <span class="media-action-title">写真を撮る</span>
              <span class="media-action-subtitle">カメラ起動</span>
              <input id="photoInput" type="file" accept="image/*" capture="environment">
            </label>
            <label class="media-action">
              <span class="media-action-title">ギャラリー</span>
              <span class="media-action-subtitle">画像を選択</span>
              <input id="galleryInput" type="file" accept="image/*">
            </label>
            <label class="media-action">
              <span class="media-action-title">動画</span>
              <span class="media-action-subtitle">撮影 / 選択</span>
              <input id="videoInput" type="file" accept="video/*" capture="environment">
            </label>
          </section>

          <img id="imagePreview" class="preview" alt="選択した画像のプレビュー" hidden>
          <video id="videoPreview" class="preview" controls playsinline hidden></video>

          <button id="sendButton" type="submit" disabled>アップロード</button>
        </form>

        <p id="status" class="status" role="status" aria-live="polite"></p>
        <a id="uploadedLink" class="uploaded-link" hidden>アップロードファイルを開く</a>
      </section>
    </main>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
