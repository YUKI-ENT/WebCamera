<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Web Camera Upload</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <div class="heading">
          <div>
            <p class="eyebrow">RSBase Camera</p>
            <h1>画像アップロード</h1>
          </div>
          <span id="modeBadge" class="mode-badge">ID連動</span>
        </div>

        <form id="uploadForm" class="upload-form">
          <section class="patient-panel" aria-label="患者情報">
            <div class="patient-topline">
              <label class="switch-row">
                <input id="useRsbase" type="checkbox" checked>
                <span class="switch" aria-hidden="true"></span>
                <span>RSBase ID連動</span>
              </label>
            </div>

            <dl class="patient-info">
              <div>
                <dt>ID</dt>
                <dd id="linkedPatientId">未取得</dd>
              </div>
              <div>
                <dt>患者名</dt>
                <dd id="linkedPatientName">未取得</dd>
              </div>
            </dl>
          </section>

          <section class="manual-panel" id="manualIdField" hidden>
            <label class="field">
              <span>手動ID</span>
              <input id="manualId" type="text" inputmode="numeric" autocomplete="off" placeholder="例: 34503">
            </label>
            <p class="hint">RSBase ID連動がOFFです。保存ファイル名に使うIDを手入力してください。</p>
          </section>

          <label class="field">
            <span>検査名</span>
            <select id="examName" required></select>
          </label>

          <label class="picker">
            <span class="picker-title">写真を撮る / 選択する</span>
            <span class="picker-subtitle">撮影後、プレビューを確認してアップロードします。</span>
            <input id="imageInput" name="image" type="file" accept="image/*" capture="environment" required>
          </label>

          <img id="preview" class="preview" alt="選択した画像のプレビュー" hidden>

          <button id="sendButton" type="submit" disabled>アップロード</button>
        </form>

        <p id="status" class="status" role="status" aria-live="polite"></p>
        <a id="uploadedLink" class="uploaded-link" hidden>アップロード画像を開く</a>
      </section>
    </main>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
